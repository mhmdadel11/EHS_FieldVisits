<script>
document.addEventListener('DOMContentLoaded',()=>{
  const input=document.getElementById('facility');
  const list=document.getElementById('facilityOptions');
  const master=Array.isArray(window.EHS_FACILITIES)?window.EHS_FACILITIES:[];
  if(list) list.innerHTML=master.map(f=>`<option value="${String(f.name||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${String(f.emirate||'')}</option>`).join('');
  const norm=v=>String(v||'').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ـ/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  input?.addEventListener('change',()=>{
    const q=norm(input.value);
    const hit=master.find(f=>norm(f.name)===q || (f.englishName && norm(f.englishName)===q));
    if(hit){
      input.value=hit.name;
      const em=document.getElementById('emirate');
      if(em && !em.value) em.value=hit.emirate||'';
    }
  });
});
</script>
<script>
(function(){
  'use strict';

  const section=document.getElementById('visitNotesSection');
  const toggle=document.getElementById('visitNotesToggle');
  const body=document.getElementById('visitNotesBody');
  const list=document.getElementById('visitNotesList');
  const toggleText=document.getElementById('notesToggleText');
  const hidden=document.getElementById('notes');
  const compliance=document.getElementById('compliance');
  if(!section||!toggle||!body||!list||!toggleText||!hidden||!compliance) return;

  const NOTE_DEDUCTION=3;
  let baseCompliance=null;
  let initializing=false;

  function clamp(n){return Math.max(0,Math.min(100,n));}

  function readBase(){
    const n=Number(compliance.value);
    baseCompliance=Number.isFinite(n)?clamp(n):92;
    compliance.dataset.baseCompliance=String(baseCompliance);
  }

  function noteInputs(){
    return Array.from(list.querySelectorAll('.visit-note-input'));
  }

  function nonEmptyNotes(){
    return noteInputs().map(x=>x.value.trim()).filter(Boolean);
  }

  function updateCompliance(){
    if(baseCompliance===null){
      const stored=Number(compliance.dataset.baseCompliance);
      baseCompliance=Number.isFinite(stored)?clamp(stored):92;
    }

    const notes=nonEmptyNotes();
    hidden.value=notes.join('\n');
    toggleText.textContent=notes.length ? `تمت إضافة ${notes.length} ملاحظة` : 'إضافة ملاحظة...';

    const result=clamp(baseCompliance-(notes.length*NOTE_DEDUCTION));
    compliance.value=String(result);

    // Automatic status rule:
    // If compliance drops below 80%, change the visit status to "غير ملتزم" immediately.
    if(result < 80){
      const status=document.getElementById('status');
      if(status) status.value='غير ملتزم';
    }

    compliance.dispatchEvent(new Event('change',{bubbles:true}));
  }

  function bindInput(input){
    if(!input || input.dataset.noteBound==='1') return;
    input.dataset.noteBound='1';
    input.addEventListener('input',updateCompliance);
    input.addEventListener('change',updateCompliance);
  }

  function createNote(value=''){
    const row=document.createElement('div');
    row.className='visit-note-row';
    row.innerHTML=`
      <textarea class="visit-note-input" placeholder="اكتب الملاحظة..."></textarea>
      <button type="button" class="remove-note-btn" aria-label="حذف الملاحظة">−</button>
      <button type="button" class="add-note-inline-btn" aria-label="إضافة ملاحظة">+</button>`;

    const input=row.querySelector('.visit-note-input');
    input.value=value;
    bindInput(input);

    row.querySelector('.remove-note-btn').addEventListener('click',function(){
      row.remove();
      if(noteInputs().length===0) createNote('');
      updateCompliance();
    });

    row.querySelector('.add-note-inline-btn').addEventListener('click',function(){
      createNote('');
    });

    list.appendChild(row);
    if(!initializing) input.focus();
    updateCompliance();
  }

  function setOpen(open){
    toggle.setAttribute('aria-expanded',open?'true':'false');
    body.hidden=!open;
    section.classList.toggle('open',open);
  }

  toggle.addEventListener('click',function(){setOpen(body.hidden);});

  // Also react if the compliance value is changed by any other field/script.
  function enforceStatusFromCompliance(){
    const value=Number(compliance.value);
    const status=document.getElementById('status');
    if(status && Number.isFinite(value) && value < 80){
      status.value='غير ملتزم';
    }
  }
  compliance.addEventListener('input',enforceStatusFromCompliance);
  compliance.addEventListener('change',enforceStatusFromCompliance);

  window.EHSVisitNotes={
    init(values){
      initializing=true;
      list.innerHTML='';
      const arr=Array.isArray(values)?values.map(v=>String(v||'').trim()).filter(Boolean):[];

      // In edit mode, the saved compliance already contains note deductions.
      // Restore the original base so each note is counted exactly once.
      const saved=Number(compliance.value);
      if(Number.isFinite(saved)){
        baseCompliance=clamp(saved+(arr.length*NOTE_DEDUCTION));
      }else{
        readBase();
      }
      compliance.dataset.baseCompliance=String(baseCompliance);

      if(arr.length){
        arr.forEach(v=>createNote(v));
      }else{
        createNote('');
      }
      initializing=false;
      updateCompliance();
      setOpen(false);
    },
    getNotes(){return nonEmptyNotes();},
    sync:updateCompliance
  };

  // Initial value is the starting percentage (normally 92%).
  readBase();
  createNote('');
  setOpen(false);

  // Extra safety: if the note row is changed by another script, keep the
  // percentage synchronized immediately.
  const observer=new MutationObserver(function(){
    noteInputs().forEach(bindInput);
    updateCompliance();
  });
  observer.observe(list,{childList:true,subtree:true});
})();
</script>
</script>
